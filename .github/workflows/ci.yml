name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Web and API
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check, test, and build
        run: npm run check

  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: frontend/flutter/.fvmrc
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: frontend/flutter
        run: flutter pub get

      - name: Analyze and test
        working-directory: frontend/flutter
        run: |
          flutter analyze
          flutter test

  apple:
    name: Apple checks
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build and test Apple targets
        run: ./scripts/apple-check.sh

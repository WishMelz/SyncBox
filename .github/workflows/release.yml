name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  IMAGE_NAME: wishmelz/syncbox

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Check Web and API
        run: npm run check

  android:
    name: Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: frontend/flutter/.fvmrc
          channel: stable
          cache: true

      - name: Build release APK
        working-directory: frontend/flutter
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          flutter pub get
          flutter build apk --release --no-pub \
            --build-name "$VERSION" \
            --build-number "${GITHUB_RUN_NUMBER}"
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/release-assets/SyncBox-Android-${RELEASE_TAG}.apk"

      - name: Upload Android asset
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/SyncBox-Android-${{ github.ref_name }}.apk
          if-no-files-found: error

  windows:
    name: Windows package
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: frontend/flutter/.fvmrc
          channel: stable
          cache: true

      - name: Build Windows desktop
        working-directory: frontend/flutter
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          flutter pub get
          $version = $env:RELEASE_TAG.TrimStart('v')
          flutter build windows --release --no-pub `
            --build-name $version `
            --build-number $env:GITHUB_RUN_NUMBER
          $asset = "SyncBox-Windows-$env:RELEASE_TAG.zip"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/release-assets" | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "$env:GITHUB_WORKSPACE/release-assets/$asset" -Force

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/SyncBox-Windows-${{ github.ref_name }}.zip
          if-no-files-found: error

  apple:
    name: Apple packages
    needs: verify
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned iOS IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          IOS_SIGNING_MODE: unsigned
          IOS_OUTPUT_DIR: ${{ runner.temp }}/syncbox-ios
        run: |
          ./scripts/build-ios-ipa.sh
          mkdir -p release-assets
          cp "$IOS_OUTPUT_DIR/SyncBox-iOS-unsigned.ipa" \
            "release-assets/SyncBox-iOS-${{ github.ref_name }}-unsigned.ipa"

      - name: Build unsigned macOS app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="$RUNNER_TEMP/SyncBox-macOS.xcarchive"
          xcodebuild -quiet \
            -project frontend/apple/SyncBox.xcodeproj \
            -scheme SyncBox \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$archive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION="${RELEASE_TAG#v}" archive
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            "$archive/Products/Applications/SyncBox.app" \
            "release-assets/SyncBox-macOS-$RELEASE_TAG.zip"

      - name: Upload Apple assets
        uses: actions/upload-artifact@v4
        with:
          name: release-apple
          path: release-assets/
          if-no-files-found: error

  docker:
    name: Docker multi-architecture image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest

  publish:
    name: Publish GitHub Release
    needs: [android, windows, apple, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create release manifest and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf '{"version":"%s","commit":"%s","image":"%s:%s"}\n' \
            "${RELEASE_TAG#v}" "$GITHUB_SHA" "$IMAGE_NAME" "$RELEASE_TAG" \
            > release-assets/manifest.json
          (cd release-assets && sha256sum * > SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*

name: syncbox
description: Private cross-device messaging for Android and Windows.
publish_to: none
version: 1.0.1+2
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  file_selector: ^1.1.0
  tray_manager: ^0.5.1
  window_manager: ^0.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/syncbox-icon.png
    - assets/branding/syncbox-icon.ico
